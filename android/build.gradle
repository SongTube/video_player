group 'io.flutter.plugins.videoplayer'
version '1.0-SNAPSHOT'
def args = ["-Xlint:deprecation","-Xlint:unchecked"]

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile){
    options.compilerArgs.addAll(args)
}

apply plugin: 'com.android.library'

android {
    namespace 'io.flutter.plugins.videoplayer'
    compileSdk 36

    defaultConfig {
        // media3 requires 21+; Flutter itself now requires 24.
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
        disable 'GradleDependency'
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependencies {
        // androidx.media3 is the continuation of com.google.android.exoplayer2,
        // which was discontinued after 2.19.1. Kept in step with the version
        // just_audio depends on so the app links a single player stack rather
        // than shipping ExoPlayer2 and media3 side by side.
        implementation 'androidx.media3:media3-exoplayer:1.4.1'
        implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
        implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
        implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.4.1'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-inline:3.9.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
